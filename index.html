<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2430" />
    <!-- 아이폰 홈 화면에 추가했을 때 상태 표시줄(시계 등)과 내용이 겹치지 않도록
         전체 화면(standalone)으로 인식시키고, 겹치는 부분은 CSS의 safe-area-inset으로 처리한다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="日本語 단어장" />
    <title>日本語 단어장</title>
    <!-- 일본어(가나/한자)가 예쁘게 보이도록 Noto Sans JP, 한글은 Noto Sans KR을 웹폰트로 불러온다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
