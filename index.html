<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2430" />
    <!-- 아이폰 홈 화면에 추가했을 때 상태 표시줄(시계 등)과 내용이 겹치지 않도록
         전체 화면(standalone)으로 인식시키고, 겹치는 부분은 CSS의 safe-area-inset으로 처리한다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="日本語 단어장" />
    <title>日本語 단어장</title>
    <!-- 일본어(가나/한자)·한글 웹폰트(Noto Sans JP / Noto Sans KR)는 Google Fonts CDN 대신
         npm 패키지(@fontsource)로 번들에 직접 포함시킨다 (src/main.jsx 참고).
         CDN 방식은 모바일에서 한자 구간별 파일이 일부만 로딩 실패하면 한 단어 안에서도
         글자마다 다른 폰트가 섞여 보이는 문제가 있어 자체 호스팅으로 바꿨다. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
